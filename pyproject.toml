[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-seib"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Franck Albinet", email = "franckalbinet@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/franckalbinet/demo-seib"
Documentation = "https://franckalbinet.github.io/demo-seib/"

[project.entry-points.nbdev]
demo_seib = "demo_seib._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "demo_seib.__version__"}

[tool.setuptools.packages.find]
include = ["demo_seib"]

[tool.nbdev]
